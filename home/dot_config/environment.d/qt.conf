# Route Qt apps through the qtct platform theme so they pick up Noctalia's
# generated colour scheme (the `qt` template writes ~/.config/qt{5,6}ct/colors/
# noctalia.conf). Without this env, Qt ignores those files entirely.
# fcitx5-configtool (the main Qt app here) is Qt6 -> qt6ct; qt5ct is installed for
# any Qt5 app. See docs/theme-sync.md.
QT_QPA_PLATFORMTHEME=qt6ct
