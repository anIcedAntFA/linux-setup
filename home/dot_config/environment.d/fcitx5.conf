# fcitx5 input-method environment.
#
# GTK_IM_MODULE is intentionally UNSET: niri implements the Wayland text-input
# protocol, so GTK apps get fcitx5 natively through it. Setting GTK_IM_MODULE=fcitx
# forces the legacy path and makes fcitx5 raise its "Wayland Diagnose" warning
# recommending you unset it (https://fcitx-im.org/wiki/Using_Fcitx_5_on_Wayland).
#
# QT_IM_MODULE is kept: Qt's Wayland text-input support is less reliable, and the
# main Qt app here (fcitx5-configtool) wants it. XMODIFIERS is kept for XWayland /
# Electron apps that don't speak the Wayland IM protocol.
#
# environment.d is read only at session start -- changes need a re-login.
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
