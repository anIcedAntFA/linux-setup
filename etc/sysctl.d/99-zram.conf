# Kernel VM tuning for zram swap (pairs with etc/systemd/zram-generator.conf).
# zram is RAM-fast, so bias the kernel toward using it and drop assumptions that
# only make sense for a rotational/SSD swap device. See docs/adr/0015.
# Applied by hand: sudo cp -> /etc/sysctl.d/99-zram.conf ; sudo sysctl --system

# Prefer compressing cold anon pages into zram over evicting file cache. On a
# RAM-backed swap the "swap is slow, avoid it" default (60) is counter-productive.
vm.swappiness = 180

# Swap readahead is pointless for RAM-backed swap (there is no seek latency to
# amortise); reading extra pages just wastes CPU/decompression.
vm.page-cluster = 0

# Reclaim tuning so zram engages a bit earlier/steadier under pressure, instead
# of the kernel's disk-swap-era hesitation. (Default watermark_boost_factor here
# was 15000; disabling the boost avoids over-reclaim thrash with fast swap.)
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
