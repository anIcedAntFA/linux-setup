# Compressed RAM swap (zram) — a cushion so a memory spike reclaims instead of the
# kernel OOM-killing GUI apps. This box has 31 GiB RAM and, before this, *zero*
# swap: a single Docker container (containerd) pushing over the line took out
# slack/teams outright. See docs/adr/0015-zram-swap-for-oom-resilience.md.
#
# NOT chezmoi-managed — a real /etc file, applied by hand like the rest of etc/:
#   sudo pacman -S --needed zram-generator
#   sudo cp etc/systemd/zram-generator.conf /etc/systemd/zram-generator.conf
#   sudo cp etc/sysctl.d/99-zram.conf       /etc/sysctl.d/99-zram.conf
#   sudo sysctl --system
#   sudo systemctl daemon-reload
#   sudo systemctl start systemd-zram-setup@zram0.service
#   zramctl        # verify: /dev/zram0 present, ALGORITHM zstd
#   swapon --show  # verify: /dev/zram0 listed
[zram0]
# Half of RAM, capped at 16 GiB. zstd compresses ~2–4×, so the effective cushion
# is larger than the nominal size; the cap keeps zram itself from ever eating the
# RAM it is meant to protect.
zram-size = min(ram / 2, 16384)
compression-algorithm = zstd
